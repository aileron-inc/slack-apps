# Bot scopes below are the owner's inference on 2026-10-07, not a live export.

_metadata:
  major_version: 2

display_information:
  name: withwork-bot
  description: フォーム投稿とランク/CA の interactivity。マル之進（Events → bypass）とは別アプリ。

features:
  bot_user:
    display_name: withwork

oauth_config:
  scopes:
    bot:
      - chat:write
      - channels:history
      - channels:read
      - groups:history
      - groups:read
      - users:read
      - usergroups:read

settings:
  org_deploy_enabled: false
  socket_mode_enabled: false
  token_rotation_enabled: false
  interactivity:
    is_enabled: true
