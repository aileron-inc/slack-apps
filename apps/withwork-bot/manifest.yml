# No Event Subscriptions. Runtime is CF Worker withwork-slack-sync
# (interactivity) and Rails SLACK_API_TOKEN. Do not point this app at
# aileron-inc/slack-support-bypass.
#
# Interactivity is on. The production Request URL is the existing
# https://withwork.com/webhook/slack/... endpoint. The remainder of that
