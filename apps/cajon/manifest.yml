# Slack app manifest (schema v2) for カクノシン (Cajon development/ads companion)
# Docs: https://docs.slack.dev/reference/app-manifest
#
# Notes (2026-09-18):
# - App display name: カクノシン
# - features.bot_user.display_name is ASCII only for apps.manifest.* → `kakunoshin`
#   (@mention is @kakunoshin). If Slack UI allows a Japanese bot display name, set カクノシン there.
# - event_subscriptions.request_url is set AFTER aileron-inc/slack-support-bypass is deployed:
#   https://<bypass-worker>/slack/cajon
# - Route/secrets stay cajon (*_CAJON) even though the character name is カクノシン.

_metadata:
  major_version: 2

display_information:
  name: カクノシン
  description: Cajon開発・広告まわりの未対応と要対応をまっちに届け、依頼があれば伴走する。

features:
  bot_user:
    display_name: kakunoshin

oauth_config:
  scopes:
    bot:
      - chat:write
      - app_mentions:read
      - channels:history
      - groups:history

settings:
  org_deploy_enabled: false
  socket_mode_enabled: false
