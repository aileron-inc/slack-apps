# Slack app manifest (schema v2) for 日向 ひなた (synsalon page support)
# Docs: https://docs.slack.dev/reference/app-manifest
#
# Notes:
# - Live app A0BUXV96DM0 on Cajon,Inc. Your Apps name: 日向 ひなた｜シンサロンページ.
#   The local hub README had no App ID. Scopes here are the bypass minimum
#   because no live export was available. Diff before re-applying.
# - A local note pointed at cajon-inc/hairbook-runbook-bot for reply code.
#   Do not migrate that code. The Slack app row is A0BUXV96DM0.
# - event_subscriptions.request_url is unset. Path is /slack/synsalon.
#   Set https://<bypass-worker>/slack/synsalon in Slack App settings.
# - Socket Mode stays off.

_metadata:
  major_version: 2

display_information:
  name: 日向 ひなた｜シンサロンページ
  description: シンサロンページのサポート。メンションとチャンネルメッセージを bypass 経由で渡す。

features:
  bot_user:
    display_name: hinata

oauth_config:
  scopes:
    bot:
      - chat:write
      - app_mentions:read
      - channels:history
      - groups:history

settings:
  org_deploy_enabled: false
  socket_mode_enabled: false
  token_rotation_enabled: false
  event_subscriptions:
    bot_events:
      - app_mention
      - message.channels
      - message.groups
