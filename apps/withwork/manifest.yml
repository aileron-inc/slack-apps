# Slack app manifest (schema v2) for コロ助 / withworkコロ助
# Docs: https://docs.slack.dev/reference/app-manifest
#
# Notes (2026-09-17):
# - features.bot_user.display_name must be ASCII for apps.manifest.create → `kolosuke`
#   (display_information.name stays 日本語). Slack UI can still show コロ助 if set there.
# - event_subscriptions.request_url is set AFTER aileron-inc/slack-support-bypass is deployed:
#   https://<bypass-worker>/slack/withwork
# - Do not invent a workers.dev hostname here.

_metadata:
  major_version: 2

display_information:
  name: withworkコロ助
  description: withwork サポートの自動返信ボット。メンションとチャンネルメッセージを Grok Bot へ渡す。

features:
  bot_user:
    display_name: kolosuke

oauth_config:
  scopes:
    bot:
      - chat:write
      - app_mentions:read
      - channels:history
      - groups:history

settings:
  org_deploy_enabled: false
  socket_mode_enabled: false
  # event_subscriptions added after Worker deploy (Request URL required by Slack API)
