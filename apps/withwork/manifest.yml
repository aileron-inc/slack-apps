# Slack app manifest (schema v2) for マル之進 (withwork support auto-reply)
# Docs: https://docs.slack.dev/reference/app-manifest
#
# Notes (2026-09-17):
# - App display name: マル之進
# - features.bot_user.display_name is ASCII only for apps.manifest.* → `marunoshin`
#   (@mention is @marunoshin). If Slack UI allows a Japanese bot display name, set マル之進 there.
# - event_subscriptions.request_url is set AFTER aileron-inc/slack-support-bypass is deployed:
#   https://<bypass-worker>/slack/withwork
# - Route/secrets stay withwork (*_WITHWORK) even though the character name is マル之進.

_metadata:
  major_version: 2

display_information:
  name: マル之進
  description: withwork サポートの自動返信ボット。メンションとチャンネルメッセージを Grok Bot へ渡す。

features:
  bot_user:
    display_name: marunoshin

oauth_config:
  scopes:
    bot:
      - chat:write
      - app_mentions:read
      - channels:history
      - groups:history

settings:
  org_deploy_enabled: false
  socket_mode_enabled: false
